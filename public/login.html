<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Club Events</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p>Sign in to see upcoming club events.</p>
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="error" role="alert">Invalid email or password.</p>
  </main>
</body>
</html>
